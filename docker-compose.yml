# Demo of horizontal scaling + hybrid multi-tenancy:
# Postgres -> one-shot migrate (catalog, identity, demo tenants and users, shared DB, tenant B's own DB) -> 2 Host instances
# -> Nginx (http://localhost:8080). Authorization server: http://auth.localhost:8080, tenants: http://tenant-a.localhost:8080 ...

x-host: &host
  build: .
  image: shell-host:local
  environment:
    ConnectionStrings__Catalog: Host=postgres;Database=shell_catalog;Username=shell;Password=shell
    ConnectionStrings__DefaultShared: Host=postgres;Database=shell_shared;Username=shell;Password=shell
    # Demo only: lets curl/Postman pick the tenant with the X-Tenant-Host header, and seeds tenant-a / tenant-b.
    Tenancy__AllowHostHeaderOverride: "true"
    Tenancy__SeedDemoTenants: "true"
    Shell__ShutdownTimeoutSeconds: 30
    Shell__TrustForwardedHeaders: "true" # only reachable through Nginx
    # Demo only: plain HTTP, self-signed token certificates generated by `migrate` into the shared volume.
    Identity__Issuer: http://auth.localhost:8080/
    Identity__RequireHttps: "false"
    Identity__Clients__RedirectUris__0: http://{domain}:8080/signin-callback
    Identity__Clients__PostLogoutRedirectUris__0: http://{domain}:8080/
    Identity__Keys__Path: /keys
    Identity__Keys__AutoGenerate: "true"
  volumes:
    - keys:/keys
  # Longer than ShutdownTimeoutSeconds so in-flight requests can finish before SIGKILL.
  stop_grace_period: 35s

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: shell_catalog
      POSTGRES_USER: shell
      POSTGRES_PASSWORD: shell
    ports:
      - "5432:5432" # for local `dotnet run` (appsettings.Development.json)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shell -d shell_catalog"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *host
    command: ["migrate"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  host1:
    <<: *host
    depends_on:
      migrate:
        condition: service_completed_successfully

  host2:
    <<: *host
    depends_on:
      migrate:
        condition: service_completed_successfully

  nginx:
    # Config is baked into the image (no bind mount, so no Docker Desktop file-sharing setup needed).
    build:
      context: ./deploy
      dockerfile_inline: |
        FROM nginx:1.28-alpine
        COPY nginx.conf /etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - host1
      - host2

volumes:
  pgdata:
  keys: # token certificates shared by every instance
