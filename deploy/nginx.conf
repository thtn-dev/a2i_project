upstream shell_hosts {
    # Round-robin, no sticky sessions: the hosts are stateless.
    # Shared zone so all nginx workers share one round-robin state.
    zone shell_hosts 64k;
    server host1:8080;
    server host2:8080;
    keepalive 16;
}

server {
    listen 80;

    location / {
        proxy_pass http://shell_hosts;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        # Host with port: the authorization server builds absolute redirects (login page) from it.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Retry the other instance only on connection failure (instance down/restarting).
        # App responses (e.g. 503 from /health/ready) are passed through, not treated as failures.
        proxy_next_upstream error timeout;

        # Shows which instance served the request (demo only).
        add_header X-Upstream $upstream_addr always;
    }
}
